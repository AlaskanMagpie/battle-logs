      {
        "@context": "https://schema.org",
        "@type": "VideoGame",

  <body>
    <div id="comic-intro"></div>
    <div id="doctrine-picker"></div>
    <canvas id="game"></canvas>
    <div id="hud-root"></div>
    <script>
      (function () {
        var q = new URLSearchParams(window.location.search);
        if (q.get("quickMatch") === "1" || q.get("testMatch") === "1") return;
        var holder = document.getElementById("doctrine-picker");
        if (!holder) return;
        var deadMs = 45000;
        var show = function () {
          if (document.querySelector("vite-error-overlay")) return;
          if (holder.querySelector("canvas.binder-picker-canvas")) return;
          var el = document.createElement("div");
          el.setAttribute("role", "alert");
          el.style.cssText =
            "position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#140808;color:#f4eee6;font:16px system-ui,Segoe UI,sans-serif;padding:28px;text-align:center;box-sizing:border-box";
          el.innerHTML =
            '<div style="max-width:36rem"><strong style="font-size:1.05em">Doctrine did not load</strong><p style="margin:14px 0;line-height:1.45;opacity:.92">This page must be served by <strong>Vite</strong> (not opened as a raw file). In the repo folder run <code style="background:#2a1818;padding:2px 6px;border-radius:4px">npm install</code> then <code style="background:#2a1818;padding:2px 6px;border-radius:4px">npm run dev</code> or <code style="background:#2a1818;padding:2px 6px;border-radius:4px">npm run localhost</code>, then open:</p><p style="margin:0 0 12px"><a href="http://127.0.0.1:2223/" style="color:#7ddbff;font-weight:600">http://127.0.0.1:2223/</a></p><p style="margin:0;font-size:.9rem;opacity:.85">If the URL is correct, press <strong>F12</strong> → Console and fix the first red error (often missing <code style="background:#2a1818;padding:1px 6px;border-radius:4px">npm install</code>).</p></div>';
          document.body.appendChild(el);
        };
        var t = window.setTimeout(show, deadMs);
        var obs = new MutationObserver(function () {
          if (holder.querySelector("canvas.binder-picker-canvas")) {
            window.clearTimeout(t);
            obs.disconnect();
          }
        });
        obs.observe(holder, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
